[project]
name = "semantic-notes-search"
version = "0.1.0"
description = "Local semantic search over Data Engineering and AI Engineering notes"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lancedb",
    "ollama>=0.6.2",
    "openai>=2.49.0",
    "pydantic",
    "pydantic-settings",
    "sentence-transformers",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.scripts]
semantic-notes = "semantic_notes.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_notes"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["semantic_notes"]
